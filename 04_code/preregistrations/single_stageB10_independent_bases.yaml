arms:
  auglin: signals as linear TD-learned features, 2 params, start u = 0.5
  augtab: 5 thresholds, signals binarised into the Q-table state; start u = 0.9 (near-zero
    effect, as B5 augtab0, which had the better training score in 3/4 B5 bases)
  bias: 'vdbe_generic without inputs: 3 constant offsets in (-6, 6), start u = 0.5'
  bio: vdbe_fuzzy, 16 params (4 centres + 12 gains), start u = 0.5
  control: further tuning of the base in the stage-B vdbe space, start at the base
  generic: vdbe_generic, 15 weights in (-3, 3), start u = 0.5
  yoked: generic with another agent's inputs (np.roll 24), 15 weights, start u = 0.5
bases: '8 new VDBE bases k = 0..7, stage-B protocol and search space (alpha0 0.02-0.9,
  eps0 0-0.5, s0 0.25-8 log, vdbe_sigma 0.001-1 log; same bounds as stage B so the
  setting is replicated): CMA-ES 30 gens x 12 x 48 agents, sigma 0.3, start u ~ U(0.1,
  0.9) from default_rng(23100 + k), CMA seed 23000 + k, generation seeds 50000000
  + 1000 k + g (new training schedules), training layout bank 400000-401999'
budget: 'each arm on each base: CMA-ES 20 gens x 12 x 48, sigma 0.15, CMA seed 24000
  + k, generation seeds 51000000 + 1000 k + g shared by all arms of base k (common
  random numbers)'
descriptive: survival, alive wellbeing, per-regime score and deaths by regime; constant-shift
  fraction (bias - control) / (generic - control) with a bootstrap over bases; parameters
  within 1% of a search bound for every base and arm
id: single_stageB10_independent_bases
inference: 'd = difference of agent-averaged score per (base, schedule), paired by
  base and schedule. Unit = base (n = 8): one-sided t-test and one-sided exact Wilcoxon
  signed-rank on the 8 base means, Holm separately for each test over P1-P5 (and over
  S1-S4); 95% three-level bootstrap CI (reanalysis_runlevel.ci3: bases, runs within
  base (one run here), schedules; 4000 draws, seed 0). A primary claim holds if the
  base-level t-test p_Holm < 0.05 AND the CI excludes 0; the Wilcoxon on base means
  is reported as a non-parametric check (disagreement reported). Also reported: the
  registered schedule-level one-sided Wilcoxon (over the 128 schedules of the base-averaged
  difference) with the 2-level hierarchical CI (stage_b3.hier_ci) and its Holm over
  P1-P5.'
interpretation: P1-P5 passing replicates the four-shared-base results with independent
  bases. S1/S4 decide whether 'bio > control' and 'about 1/3 of the gain is a constant
  shift' can be stated without the qualifier 'on four shared bases'. No detectable
  difference is not equivalence.
predictions:
  P1: generic > control
  P2: generic > yoked
  P3: generic > augtab
  P4: generic > auglin
  P5: generic > bias
question: Do the tabular add-on results hold when the base learner itself is replicated
  (8 independently tuned VDBE bases, one add-on run per arm and base)?
registered: after the 2026-10-21 review and base-level re-analysis, before any B10
  run
secondary:
  S1: bio > control (one-sided)
  S2: bio vs bias (two-sided)
  S3: generic > bio (one-sided)
  S4: bias > control (one-sided)
test: 'new independent set, never used: 128 schedules (seeds 20000-20127) x 4 agents,
  layout bank 2000000-2000999, simulator seeds 86000 + k (shared by all arms of base
  k)'
